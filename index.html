// Fonction pour gérer la recherche sur le blog
function performBlogSearch() {
  const searchTerm = document.getElementById('blogSearch').value.trim();
  
  if (!searchTerm) {
    alert(currentLang === 'fr' ? 'Veuillez saisir un terme de recherche' : 'Please enter a search term');
    return;
  }

  // Afficher les résultats de recherche
  const resultsDiv = document.getElementById('searchResults');
  const resultsListDiv = document.getElementById('searchResultsList');
  
  resultsDiv.classList.remove('hidden');
  resultsListDiv.innerHTML = `
    <div class="flex items-center justify-center py-4">
      <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-yellow-500"></div>
      <span class="ml-2">${currentLang === 'fr' ? 'Recherche en cours...' : 'Searching...'}</span>
    </div>
  `;

  // Ouvrir la recherche Google avec l'opérateur site:
  const searchUrl = `https://www.google.com/search?q=site:blog.facommunication.tg ${encodeURIComponent(searchTerm)}`;
  
  // Simuler des résultats (en réalité, on redirige vers Google)
  setTimeout(() => {
    resultsListDiv.innerHTML = `
      <div class="space-y-3">
        <div class="text-sm text-gray-200 dark:text-gray-200 mb-3 font-light">
          ${currentLang === 'fr' ? 'Recherche pour' : 'Searching for'}: "<strong>${searchTerm}</strong>"
        </div>
        <div class="bg-white text-white dark:bg-gray-700 p-3 rounded border-l-4 border-yellow-400">
          <p class="text-sm  dark:text-gray-200 mb-2">
            ${currentLang === 'fr' ? 'Les résultats de recherche s\'ouvriront dans un nouvel onglet Google.' : 'Search results will open in a new Google tab.'}
          </p>
          <a href="${searchUrl}" target="_blank" class="inline-flex items-center text-yellow-600 hover:text-yellow-700 dark:text-yellow-400 dark:hover:text-yellow-300 text-sm font-medium">
            ${currentLang === 'fr' ? 'Voir les résultats' : 'View results'}
            <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
            </svg>
          </a>
        </div>
        <div class="text-white text-sm dark:text-gray-300">
          ${currentLang === 'fr' ? 'Recherche limitée au site blog.facommunication.tg' : 'Search limited to blog.facommunication.tg'}
        </div>
      </div>
    `;
  }, 1000);

  // Optionnel: ouvrir directement la recherche Google
  // window.open(searchUrl, '_blank');
}


// Fonction pour gérer la touche Entrée dans la barre de recherche
function handleSearchKeyPress(event) {
  if (event.key === 'Enter') {
    event.preventDefault();
    performBlogSearch();
  }
}

 // Fonction pour gérer la touche Entrée dans l'interface IA
function handleAIKeyPress(event) {
  if (event.key === 'Enter') {
    event.preventDefault();
    askAI();
  }
}  


// Fonction pour l'interface IA (à adapter selon besoins)
function askAI() {
  const query = document.getElementById('aiQuery').value.trim();
  const responseDiv = document.getElementById('aiResponse');
  const responseText = document.getElementById('aiResponseText');
  
  if (!query) {
    alert(currentLang === 'fr' ? 'Veuillez poser une question' : 'Please ask a question');
    return;
  }

  responseDiv.classList.remove('hidden');
  responseText.innerHTML = `
    <div class="flex items-center text-white">
      <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-yellow-500 mr-2"></div>
      ${currentLang === 'fr' ? 'L\'IA réfléchit à votre question...' : 'AI is thinking about your question...'}
    </div>
  `;

  // Simuler une réponse IA (à remplacer par le vraie API)
  setTimeout(() => {
    responseText.innerHTML = `
      <p class="text-white"><strong>${currentLang === 'fr' ? 'Question' : 'Question'}:</strong> ${query}</p>
      <p class="mt-2 text-white"><strong>${currentLang === 'fr' ? 'Réponse' : 'Answer'}:</strong> ${currentLang === 'fr' ? 'Cette fonctionnalité sera bientôt disponible. En attendant, vous pouvez utiliser la barre de recherche ci-dessus pour trouver des articles sur le blog.' : 'This feature will be available soon. In the meantime, you can use the search bar above to find articles on the blog.'}</p>
    `;
  }, 2000);
}

    function renderContent(view) {
      currentView = view;
      const content = views[view] ? views[view]() : views.home();
      document.getElementById("main-content").innerHTML = content;
      updateMeta();
    }

    function switchContent(val) {
      if (["home", "fa", "yo", "wo", "he"].includes(val)) {
        renderContent(val);
      }
    }

    // Gestion de la recherche dans la barre principale
    document.addEventListener('DOMContentLoaded', function() {
      const searchInput = document.querySelector('input[placeholder*="naviguer"]');
      if (searchInput) {
        searchInput.addEventListener('input', function(e) {
          const value = e.target.value.toLowerCase();
          if (["home", "fa", "yo", "wo", "he"].includes(value)) {
            renderContent(value);
          }
        });
      }
    });

    // Initialisation
    renderContent('home');
    updateMeta();
  </script>
